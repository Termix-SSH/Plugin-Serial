name: Release

# Official plugins release from Termix-SSH/Termix-Registry with the Release
# Plugin workflow. This one refuses Termix-SSH repos right away, so it needs
# no secrets and only read access.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Stable release or beta"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      mode:
        description: "release, overwrite (stable only) or dry-run"
        required: true
        default: release
        type: choice
        options:
          - release
          - overwrite
          - dry-run

permissions: {}

jobs:
  release:
    permissions:
      contents: read
    uses: Termix-SSH/Termix-Registry/.github/workflows/plugin-release.yml@main
    with:
      channel: ${{ inputs.channel }}
      mode: ${{ inputs.mode }}
