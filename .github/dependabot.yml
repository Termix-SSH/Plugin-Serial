version: 2
updates:
  # npm waits 3 days after a release. Minor and patch updates come as one
  # weekly PR, each major as its own PR. Security updates skip the wait.
  - package-ecosystem: npm
    directories:
      - "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    # SDK bumps go with engine.termix changes, so they are made by hand.
    ignore:
      - dependency-name: "@termix-ssh/plugin-sdk"
      # Core shares one copy of these with every plugin, so their majors
      # follow core and the SDK.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sonner"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore

  # Keeps the SHA pinned actions current. The cooldown skips releases younger
  # than a week.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
